
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulaire administratif</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-10">

      <div class="card shadow p-4">
        <h2 class="text-center mb-4">Formulaire de renseignement administratif</h2>

        <form>

          <!-- INFORMATIONS -->
          <h5 class="mb-3">Informations personnelles</h5>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Nom</label>
              <input type="text" class="form-control" placeholder="Entrez votre nom">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Prénom</label>
              <input type="text" class="form-control" placeholder="Entrez votre prénom">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Date de naissance</label>
              <input type="date" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Sexe</label>
              <select class="form-select">
                <option>Choisir...</option>
                <option>Homme</option>
                <option>Femme</option>
              </select>
            </div>
          </div>

          <!-- COORDONNÉES -->
          <h5 class="mt-4 mb-3">Coordonnées</h5>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" placeholder="Entrez votre email">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Téléphone</label>
              <input type="text" class="form-control" placeholder="Entrez votre numéro">
            </div>

            <div class="col-md-12 mb-3">
              <label class="form-label">Adresse</label>
              <input type="text" class="form-control" placeholder="Entrez votre adresse">
            </div>
          </div>

          <!-- INFORMATIONS    -->
          <h5 class="mt-4 mb-3">Informations complémentaires</h5>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Ville</label>
              <input type="text" class="form-control" placeholder="Entrez votre ville">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Code postal</label>
              <input type="text" class="form-control" placeholder="Entrez votre code postal">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Nationalité</label>
              <input type="text" class="form-control" placeholder="Entrez votre nationalité">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Situation professionnelle</label>
              <select class="form-select">
                <option>Choisir...</option>
                <option>Étudiant</option>
                <option>Salarié</option>
                <option>Sans emploi</option>
              </select>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Formation souhaitée</label>
              <select class="form-select">
                <option>Choisir...</option>
                <option>Développement Web</option>
                <option>Réseaux</option>
              </select>
            </div>

            <div class="col-md-12 mb-3">
              <label class="form-label">Commentaires</label>
              <textarea class="form-control" rows="3"></textarea>
            </div>
          </div>

          <!-- CHECKBOX -->
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">
              J'accepte les conditions
            </label>
          </div>

          <!-- BOUTONS -->
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Envoyer</button>
            <button type="reset" class="btn btn-secondary">Réinitialiser</button>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
